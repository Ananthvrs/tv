<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV Home & Fullscreen Player</title>
    <!-- HLS.js for streaming M3U8 links -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Home Page Layout: Sidebar Always Visible on First Page */
        .sidebar {
            width: 320px;
            background-color: #14161c;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2e3d;
            z-index: 5;
            height: 100vh;
        }

        .logo-area {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
            background: #101217;
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area span {
            color: #fff;
        }

        .search-box {
            padding: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #1f222b;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px 10px;
        }

        .channel-list::-webkit-scrollbar {
            width: 5px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 8px;
            background: #1c1f28;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover, .channel-item.active {
            background: #007bff;
            transform: translateX(4px);
        }

        .channel-icon {
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 50%;
            font-size: 14px;
        }

        .channel-item.active .channel-icon {
            background: #fff;
            color: #007bff;
        }

        .channel-info h4 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        /* Main Fullscreen Video Area */
        .main-content {
            flex: 1;
            position: relative;
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: contain;
        }

        .placeholder-text {
            position: absolute;
            color: #777;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
        }

        /* Transparent Floating Controls (Auto-hide after 3 seconds) */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.7) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            transition: opacity 0.4s ease;
            pointer-events: none; /* Allows click through when hidden */
        }

        .player-overlay.hidden {
            opacity: 0;
        }

        /* Enable interaction for actual buttons inside overlay */
        .player-overlay * {
            pointer-events: auto;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .current-channel-title {
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s, transform 0.2s;
        }

        .control-btn:hover {
            background: rgba(0, 123, 255, 0.8);
            transform: scale(1.05);
        }

        /* Responsive design for mobiles */
        @media(max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 50vh;
            }
            .main-content {
                width: 100%;
                height: 50vh;
            }
        }
    </style>
</head>
<body onmousemove="resetHideTimer()" ontouchstart="resetHideTimer()">

    <!-- Home Page Sidebar: Channel List -->
    <div class="sidebar">
        <div class="logo-area">
            Jio<span>TV</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchBox" placeholder="சேனலைத் தேட..." onkeyup="filterChannels()">
        </div>
        <div class="channel-list" id="channelList">
            <!-- Channels loaded dynamically -->
        </div>
    </div>

    <!-- Fullscreen Video Player Area -->
    <div class="main-content" onclick="resetHideTimer()">
        <div class="placeholder-text" id="placeholder">பட்டியலில் இருந்து ஒரு சேனலைத் தேர்ந்தெடுக்கவும்</div>
        <video id="videoPlayer" controls autoplay></video>

        <!-- Transparent Overlay Controls (Auto-hide in 3s) -->
        <div class="player-overlay hidden" id="playerOverlay">
            <div class="top-bar">
                <div class="current-channel-title" id="currentTitle">எந்த சேனலும் இயங்கவில்லை</div>
            </div>
            <div class="bottom-bar">
                <button class="control-btn" onclick="prevChannel()">⏮ Previous</button>
                <button class="control-btn" onclick="nextChannel()">Next ⏭</button>
            </div>
        </div>
    </div>

    <script>
        // M3U Playlist Data
        const m3uData = [
            { name: "Sana TV", url: "https://stream.galaxyott.live/live/sanatv/index.m3u8" },
            { name: "Sana TV [YuppTV]", url: "https://vglivessai.akamaized.net/us/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/b6d9e864-ec16-410a-804d-ccf8f720bfaa/index.m3u8" },
            { name: "Sana TV [Tata Play]", url: "https://cable75tataplay.akamaized.net/hls/sanatv.m3u8" },
            { name: "Sana Plus", url: "https://galaxyott.live/hls/sanaplus.m3u8" },
            { name: "NTC TV", url: "https://galaxyott.live/hls/ntv.m3u8" },
            { name: "Ultimate TV", url: "https://stream.galaxyott.live/live/utv/index.m3u8" },
            { name: "Anandham TV", url: "https://server.sscloud7.in/live/anandhamtv/index.mpd" },
            { name: "Suriya TV", url: "https://galaxyott.live/hls/suryatv.m3u8" },
            { name: "Subin TV", url: "https://stream.galaxyott.live/live/subintv/index.m3u8" },
            { name: "Dharsan TV", url: "https://galaxyott.live/hls/dharshantv.m3u8" },
            { name: "Rock TV", url: "https://apis.avmediawork.in/tvhls/rocktv.m3u8" },
            { name: "Aaryaa TV", url: "https://stream.ottlive.co.in/aryatvtamil/index.m3u8" },
            { name: "Roja TV", url: "https://rojatv.cloud/rojatv/rojatv/index.m3u8" },
            { name: "Roja Movies", url: "https://live.rojatv.cloud/rojamovies/rojamovies/index.m3u8" },
            { name: "Nijam TV", url: "https://nijamtv.nijamtv.org/live/nijamtv/index.m3u8" },
            { name: "KC TV", url: "https://rtmp.bmlive.net/bms/kctv/stream.m3u8" },
            { name: "Om Sakthi TV", url: "https://live1.sscloud7.com/live/omsakthitv/index.mpd" },
            { name: "Oli TV", url: "https://live.olidigital.in/olitv/olitv/index.m3u8" },
            { name: "Moon TV", url: "https://live.sscloud7.in/live/moontv/index.m3u8" },
            { name: "Kumari TV", url: "https://play.applelive.in/kumaritv/gvkumaritv.m3u8" },
            { name: "Sakthi TV", url: "https://live.sscloud7.in/live/sakthitv/index.m3u8" },
            { name: "Surya TV", url: "https://surya.suriyantv.in/hls/app/index.m3u8" }
        ];

        let currentIndex = -1;
        let hls = null;
        let hideTimeout = null;

        const channelListContainer = document.getElementById('channelList');
        const videoPlayer = document.getElementById('videoPlayer');
        const currentTitle = document.getElementById('currentTitle');
        const placeholder = document.getElementById('placeholder');
        const playerOverlay = document.getElementById('playerOverlay');

        function loadChannels(channels) {
            channelListContainer.innerHTML = '';
            channels.forEach((channel) => {
                const originalIndex = m3uData.findIndex(ch => ch.url === channel.url);
                const item = document.createElement('div');
                item.className = `channel-item ${currentIndex === originalIndex ? 'active' : ''}`;
                
                const firstLetter = channel.name.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="channel-icon">${firstLetter}</div>
                    <div class="channel-info">
                        <h4>${channel.name}</h4>
                    </div>
                `;
                item.onclick = () => {
                    playChannel(originalIndex);
                };
                channelListContainer.appendChild(item);
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= m3uData.length) return;
            currentIndex = index;
            const channel = m3uData[currentIndex];

            currentTitle.innerText = channel.name;
            placeholder.style.display = 'none';

            // Refresh channel list to update active highlight
            filterChannels();

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play();
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.url;
                videoPlayer.addEventListener('loadedmetadata', function() {
                    videoPlayer.play();
                });
            }

            resetHideTimer();
        }

        function nextChannel() {
            if (m3uData.length === 0) return;
            let nextIdx = (currentIndex + 1) % m3uData.length;
            playChannel(nextIdx);
        }

        function prevChannel() {
            if (m3uData.length === 0) return;
            let prevIdx = (currentIndex - 1 + m3uData.length) % m3uData.length;
            playChannel(prevIdx);
        }

        function filterChannels() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = m3uData.filter(ch => ch.name.toLowerCase().includes(query));
            loadChannels(filtered);
        }

        // Auto-Hide Controls Logic (3 seconds)
        function resetHideTimer() {
            // Only show overlay if a video is actually playing
            if (currentIndex !== -1) {
                playerOverlay.classList.remove('hidden');
                clearTimeout(hideTimeout);
                
                hideTimeout = setTimeout(() => {
                    playerOverlay.classList.add('hidden');
                }, 3000);
            }
        }

        // Initial Load
        loadChannels(m3uData);
    </script>
</body>
</html>
