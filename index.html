<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV Mobile Style App</title>
    <!-- HLS.js for streaming M3U8 links -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1. Home Screen: TV Channel List */
        .home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0f1015;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .home-screen.hidden {
            transform: translateY(-100%);
            pointer-events: none;
        }

        .header {
            padding: 18px 20px;
            background: #161821;
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            border-bottom: 1px solid #222634;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header span {
            color: #fff;
        }

        .search-box {
            padding: 15px 20px;
            background: #12141c;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #1c1f2a;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .tv-grid {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .tv-grid::-webkit-scrollbar {
            width: 5px;
        }

        .tv-grid::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 10px;
        }

        .tv-card {
            background: #1a1d28;
            border: 1px solid #262a39;
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tv-card:hover {
            background: #007bff;
            border-color: #007bff;
            transform: translateY(-3px);
        }

        .tv-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tv-card:hover .tv-icon {
            background: #fff;
            color: #007bff;
        }

        .tv-card h4 {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 2. Full Screen Video Player Screen */
        .player-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .player-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: contain;
        }

        /* Transparent Overlay Controls Inside Player (Auto-hide in 3s) */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.7) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .player-overlay.hidden {
            opacity: 0;
        }

        .player-overlay * {
            pointer-events: auto;
        }

        .top-control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .current-channel-name {
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 6px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bottom-control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s, transform 0.2s;
        }

        .control-btn:hover {
            background: rgba(0, 123, 255, 0.8);
            transform: scale(1.05);
        }
    </style>
</head>
<body onmousemove="resetHideTimer()" ontouchstart="resetHideTimer()">

    <!-- Home Screen with Channel Grid -->
    <div class="home-screen" id="homeScreen">
        <div class="header">
            Jio<span>TV</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchBox" placeholder="சேனலைத் தேட..." onkeyup="filterChannels()">
        </div>
        <div class="tv-grid" id="tvGrid">
            <!-- Channels loaded dynamically -->
        </div>
    </div>

    <!-- Full Screen Video Player Screen -->
    <div class="player-screen" id="playerScreen" onclick="resetHideTimer()">
        <video id="videoPlayer" controls autoplay></video>

        <!-- Transparent Overlay Controls (Auto-hide in 3s) -->
        <div class="player-overlay" id="playerOverlay">
            <div class="top-control-bar">
                <button class="back-btn" onclick="goBackToHome()">⬅ Back</button>
                <div class="current-channel-name" id="currentTitle">Channel Name</div>
            </div>
            <div class="bottom-control-bar">
                <button class="control-btn" onclick="prevChannel()">⏮ Previous</button>
                <button class="control-btn" onclick="nextChannel()">Next ⏭</button>
            </div>
        </div>
    </div>

    <script>
        // M3U Playlist Data
        const m3uData = [
            { name: "Sana TV", url: "https://stream.galaxyott.live/live/sanatv/index.m3u8" },
            { name: "Sana TV [YuppTV]", url: "https://vglivessai.akamaized.net/us/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/b6d9e864-ec16-410a-804d-ccf8f720bfaa/index.m3u8" },
            { name: "Sana TV [Tata Play]", url: "https://cable75tataplay.akamaized.net/hls/sanatv.m3u8" },
            { name: "Sana Plus", url: "https://galaxyott.live/hls/sanaplus.m3u8" },
            { name: "NTC TV", url: "https://galaxyott.live/hls/ntv.m3u8" },
            { name: "Ultimate TV", url: "https://stream.galaxyott.live/live/utv/index.m3u8" },
            { name: "Anandham TV", url: "https://server.sscloud7.in/live/anandhamtv/index.mpd" },
            { name: "Suriya TV", url: "https://galaxyott.live/hls/suryatv.m3u8" },
            { name: "Subin TV", url: "https://stream.galaxyott.live/live/subintv/index.m3u8" },
            { name: "Dharsan TV", url: "https://galaxyott.live/hls/dharshantv.m3u8" },
            { name: "Rock TV", url: "https://apis.avmediawork.in/tvhls/rocktv.m3u8" },
            { name: "Aaryaa TV", url: "https://stream.ottlive.co.in/aryatvtamil/index.m3u8" },
            { name: "Roja TV", url: "https://rojatv.cloud/rojatv/rojatv/index.m3u8" },
            { name: "Roja Movies", url: "https://live.rojatv.cloud/rojamovies/rojamovies/index.m3u8" },
            { name: "Nijam TV", url: "https://nijamtv.nijamtv.org/live/nijamtv/index.m3u8" },
            { name: "KC TV", url: "https://rtmp.bmlive.net/bms/kctv/stream.m3u8" },
            { name: "Om Sakthi TV", url: "https://live1.sscloud7.com/live/omsakthitv/index.mpd" },
            { name: "Oli TV", url: "https://live.olidigital.in/olitv/olitv/index.m3u8" },
            { name: "Moon TV", url: "https://live.sscloud7.in/live/moontv/index.m3u8" },
            { name: "Kumari TV", url: "https://play.applelive.in/kumaritv/gvkumaritv.m3u8" },
            { name: "Sakthi TV", url: "https://live.sscloud7.in/live/sakthitv/index.m3u8" },
            { name: "Surya TV", url: "https://surya.suriyantv.in/hls/app/index.m3u8" }
        ];

        let currentIndex = -1;
        let hls = null;
        let hideTimeout = null;

        const tvGrid = document.getElementById('tvGrid');
        const homeScreen = document.getElementById('homeScreen');
        const playerScreen = document.getElementById('playerScreen');
        const videoPlayer = document.getElementById('videoPlayer');
        const currentTitle = document.getElementById('currentTitle');
        const playerOverlay = document.getElementById('playerOverlay');

        function loadHomeChannels(channels) {
            tvGrid.innerHTML = '';
            channels.forEach((channel) => {
                const originalIndex = m3uData.findIndex(ch => ch.url === channel.url);
                const card = document.createElement('div');
                card.className = 'tv-card';
                
                const firstLetter = channel.name.charAt(0).toUpperCase();

                card.innerHTML = `
                    <div class="tv-icon">${firstLetter}</div>
                    <h4>${channel.name}</h4>
                `;
                card.onclick = () => {
                    playChannel(originalIndex);
                };
                tvGrid.appendChild(card);
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= m3uData.length) return;
            currentIndex = index;
            const channel = m3uData[currentIndex];

            currentTitle.innerText = channel.name;

            // Switch screens: Hide Home, Show Player Fullscreen
            homeScreen.classList.add('hidden');
            playerScreen.classList.add('active');

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play();
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.url;
                videoPlayer.addEventListener('loadedmetadata', function() {
                    videoPlayer.play();
                });
            }

            resetHideTimer();
        }

        function goBackToHome() {
            // Pause video to save bandwidth/stream
            videoPlayer.pause();
            if (hls) {
                hls.destroy();
                hls = null;
            }

            // Switch screens: Show Home, Hide Player
            playerScreen.classList.remove('active');
            homeScreen.classList.remove('hidden');
        }

        function nextChannel() {
            if (m3uData.length === 0) return;
            let nextIdx = (currentIndex + 1) % m3uData.length;
            playChannel(nextIdx);
        }

        function prevChannel() {
            if (m3uData.length === 0) return;
            let prevIdx = (currentIndex - 1 + m3uData.length) % m3uData.length;
            playChannel(prevIdx);
        }

        function filterChannels() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = m3uData.filter(ch => ch.name.toLowerCase().includes(query));
            loadHomeChannels(filtered);
        }

        // Auto-Hide Controls Logic (3 seconds)
        function resetHideTimer() {
            if (playerScreen.classList.contains('active')) {
                playerOverlay.classList.remove('hidden');
                clearTimeout(hideTimeout);
                
                hideTimeout = setTimeout(() => {
                    playerOverlay.classList.add('hidden');
                }, 3000);
            }
        }

        // Initial Load
        loadHomeChannels(m3uData);
    </script>
</body>
</html>
