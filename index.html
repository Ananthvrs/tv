function typeOf(n){
  n=n.toLowerCase();
  if(/music|isai|melodies|musix|retro/.test(n)) return "music";
  if(/movie|cinema|thirai/.test(n)) return "movie";
  if(/news|media/.test(n)) return "news";
  if(/jesus|bible|christ|gospel|praise|grace|heaven|salvation|faith|devotional|sakthi|amman|deive|mahima|matha|nithya|shekinah|cross|islamic/.test(n)) return "devotional";
  return "all";
}
function visible(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  return channels.filter(c=>(filter==="all"||typeOf(c.name)===filter)&&(!q||c.name.toLowerCase().includes(q)));
}
function render(){
  const arr=visible();
  document.getElementById("count").textContent=arr.length+" channels";
  document.getElementById("list").innerHTML=arr.map((c,i)=>{
    const idx=channels.indexOf(c);
    const active=idx===current?" active":"";
    return `<article class="card${active}" data-index="${idx}">
      <div class="chlogo">${esc(initials(c.name))}</div>
      <div class="poster">▶</div>
      <div class="info"><div class="name">${esc(c.name)}</div>
      <div class="time">LIVE • ${idx+1}</div><div class="bar"><i></i></div></div>
    </article>`;
  }).join("");
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>play(+el.dataset.index));
}
function play(i){
  if(i<0||i>=channels.length)return;
  current=i;
  const c=channels[i], v=document.getElementById("video");
  document.getElementById("empty").style.display="none";
  document.getElementById("nowTitle").textContent=c.name;
  document.getElementById("nowMeta").textContent="Live TV • Channel "+(i+1)+" / "+channels.length;
  if(hls){hls.destroy();hls=null}
  v.pause(); v.removeAttribute("src"); v.load();
  if(c.url.includes(".mpd")){
    document.getElementById("empty").textContent="This stream is MPEG-DASH (.mpd). Use a DASH-capable player/browser.";
    document.getElementById("empty").style.display="grid";
  }else if(window.Hls && Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:20});
    hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){document.getElementById("empty").textContent="Stream unavailable / blocked";document.getElementById("empty").style.display="grid"}});
  }else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=c.url; v.play().catch(()=>{});
  }else{
    document.getElementById("empty").textContent="HLS is not supported in this browser.";
    document.getElementById("empty").style.display="grid";
  }
  document.getElementById("playerBox").classList.add("show");
  clearTimeout(window.hideTimer); window.hideTimer=setTimeout(()=>document.getElementById("playerBox").classList.remove("show"),2500);
  render();
}
function move(step){play((current<0?0:current)+step)}
document.getElementById("prevBtn").onclick=e=>{e.stopPropagation();move(-1)}
document.getElementById("nextBtn").onclick=e=>{e.stopPropagation();move(1)}
document.getElementById("playerBox").addEventListener("click",()=>{clearTimeout(window.hideTimer);document.getElementById("playerBox").classList.toggle("show");window.hideTimer=setTimeout(()=>document.getElementById("playerBox").classList.remove("show"),2500)})
document.getElementById("searchBtn").onclick=()=>{const s=document.getElementById("searchBox");s.style.display=s.style.display==="block"?"none":"block";if(s.style.display==="block")document.getElementById("search").focus()}
document.getElementById("search").oninput=render;
document.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));p.classList.add("active");filter=p.dataset.filter;render()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});
render();
</script>
</body>
</html>
