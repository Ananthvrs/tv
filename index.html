        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 300px;
            background-color: #1a1c23;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2a2e3d;
        }

        .logo-area {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
            background: #14161c;
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area span {
            color: #fff;
        }

        .search-box {
            padding: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: #262935;
            border: none;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px 10px;
        }

        .channel-list::-webkit-scrollbar {
            width: 5px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #33394d;
            border-radius: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #21242e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover, .channel-item.active {
            background: #007bff;
            transform: translateX(4px);
        }

        .channel-icon {
            width: 35px;
            height: 35px;
            background: #007bff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 50%;
            font-size: 14px;
        }

        .channel-item.active .channel-icon {
            background: #fff;
            color: #007bff;
        }

        .channel-info h4 {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 210px;
        }

        /* Main Content / Player Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b0c10;
        }

        .player-container {
            width: 100%;
            height: 70vh;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .placeholder-text {
            position: absolute;
            color: #666;
            font-size: 18px;
        }

        .current-playing-info {
            padding: 20px;
            background: #14161c;
            border-top: 1px solid #2a2e3d;
            flex: 1;
        }

        .current-playing-info h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #fff;
        }

        .current-playing-info p {
            color: #8a8f9d;
            font-size: 14px;
        }

        /* Responsive */
        @media(max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 40vh;
            }
            .player-container {
                height: 60vh;

        const channelListContainer = document.getElementById('channelList');
        const videoPlayer = document.getElementById('videoPlayer');
        const channelTitle = document.getElementById('channelTitle');
        const channelCategory = document.getElementById('channelCategory');
        const placeholder = document.getElementById('placeholder');

        let hls = null;

        function loadChannels(channels) {
            channelListContainer.innerHTML = '';
            channels.forEach((channel) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                
                // First letter for channel avatar fallback
                const firstLetter = channel.name.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="channel-icon">${firstLetter}</div>
                    <div class="channel-info">
                        <h4>${channel.name}</h4>
                    </div>
                `;
                item.onclick = () => playChannel(channel, item);
                channelListContainer.appendChild(item);
            });
        }

        function playChannel(channel, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            channelTitle.innerText = channel.name;
            channelCategory.innerText = "நேலை ஒளிபரப்பு (Live Stream)";
            placeholder.style.display = 'none';

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(channel.url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play();
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.url;
                videoPlayer.addEventListener('loadedmetadata', function() {
                    videoPlayer.play();
                });
            }
        }

        function filterChannels() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = m3uData.filter(ch => ch.name.toLowerCase().includes(query));
            loadChannels(filtered);
        }

        // Initial Load
        loadChannels(m3uData);
